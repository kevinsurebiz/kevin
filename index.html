<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Valentine 💖</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 350px;
            z-index: 2;
        }

        h1 {
            color: #e63946;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: #e63946;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c9182b;
            transform: scale(1.05);
        }

        .message {
            display: none;
            margin-top: 20px;
            color: #e63946;
            font-size: 18px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            bottom: -20px;
            font-size: 20px;
            color: rgba(230, 57, 70, 0.8);
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Background Music -->
    <audio id="music" loop>
        <source src="Billie Eilish - BIRDS OF A FEATHER.mp3" type="audio/mpeg">
    </audio>

    <div class="card">
        <h1>Happy Valentine’s Day 💕</h1>
        <p>I made this just for you.</p>
        <button onclick="startSurprise()">Click Me ❤️</button>

        <div class="message" id="loveMessage">
            <p>
                You are my favorite person,  
                my safe place,  
                and my greatest happiness. 💖  
                <br><br>
                I love you more than words can say.
            </p>
        </div>
    </div>

    <script>
        function startSurprise() {
            document.getElementById("loveMessage").style.display = "block";
            document.getElementById("music").play();
            createHearts();
        }

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement("div");
                heart.classList.add("heart");
                heart.innerHTML = "❤️";
                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);
            }, 300);
        }
    </script>

</body>
</html>
